
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIVA - Your World</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#050509;--panel:#10101a;--panel2:#171725;--border:#29293b;--text:#f5f5ff;--muted:#9999b0;--blue:#38bdf8;--purple:#9b5cff}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(110deg,#287bff,#8c42e8);color:white;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
button.light{background:#242438;color:#eee}
button.outline{background:transparent;color:#eee;border:1px solid var(--border)}
header{height:68px;background:#080810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 950px)/2));position:sticky;top:0;z-index:10}

/* WIVA KROM + MOR KURE + NEON YORUNGE LOGOSU */
.logo{
position:relative;
display:inline-flex;
align-items:center;
font-size:32px;
font-weight:950;
letter-spacing:3px;
line-height:1;
color:#e8e8f5;
background:linear-gradient(180deg,#fff 0%,#bfc2d3 22%,#fff 40%,#73778d 58%,#f5f5ff 76%,#8c91a8 100%);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 5px #8b5cff88);
user-select:none;
}
.logo-a{
position:relative;
display:inline-block;
margin-left:1px;
color:#fff;
background:linear-gradient(180deg,#fff 0%,#c5c8dc 28%,#fff 48%,#73778d 70%,#fff 100%);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}
.logo-orb{
position:absolute;
width:13px;
height:13px;
left:50%;
top:58%;
transform:translate(-50%,-50%);
border-radius:50%;
background:radial-gradient(circle at 35% 28%,#fff 0%,#e8caff 9%,#b45cff 28%,#7122e8 58%,#26065e 100%);
box-shadow:0 0 5px #fff,0 0 12px #a34dff,0 0 21px #782cff;
z-index:2;
-webkit-text-fill-color:initial;
}
.logo-orbit{
position:absolute;
width:31px;
height:12px;
left:50%;
top:58%;
transform:translate(-50%,-50%) rotate(-24deg);
border:1.5px solid #c66cff;
border-radius:50%;
box-shadow:0 0 7px #8b35ff,0 0 12px #4b9dff;
z-index:3;
pointer-events:none;
}
.header-right{font-size:11px;color:#aaa8d0;letter-spacing:2px}
.container{max-width:680px;margin:20px auto;padding:0 12px 95px}
.card,.post{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 5px 25px #0005}
h2{font-size:21px;margin:0 0 16px}
h3{font-size:16px;margin:0}
input,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:#090912;color:white;margin:6px 0 12px;outline:none}
input:focus,textarea:focus{border-color:#7660ff;box-shadow:0 0 0 2px #7650ff22}
input::placeholder,textarea::placeholder{color:#77778e}
label{font-size:12px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.muted{color:#888}
.hidden{display:none!important}
.page{display:none}
.page.active{display:block}
#app{display:none}
#auth{max-width:420px;margin:35px auto}
#auth button{width:100%;margin-top:7px}
.message{font-size:13px;color:#a8a1ff;margin-top:10px;white-space:pre-wrap}
nav{position:fixed;bottom:0;left:0;right:0;background:#090912;border-top:1px solid var(--border);display:flex;justify-content:center;z-index:20;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:135px;background:transparent;color:#9292aa;padding:10px 2px;font-size:12px}
nav button.active{color:#fff;background:#25213d;box-shadow:inset 0 -2px #8d64ff}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#222}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.post-avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#222}
.post-head .who{flex:1;min-width:0}
.post-media{width:100%;max-height:650px;object-fit:contain;background:#050509;border-radius:10px;margin-top:10px}
.post-text{white-space:pre-wrap;line-height:1.5;margin:10px 0}
.post-actions{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
.post-actions button{padding:8px 11px;font-size:13px}
.post-date{font-size:11px;color:#777;margin-top:12px}
.profile{text-align:center}
.profile-stats{display:flex;justify-content:center;gap:32px;margin:18px 0}
.profile-stats div{text-align:center}
.profile-stats strong{display:block;font-size:19px;color:#b9a1ff}
.profile-stats span{font-size:12px;color:var(--muted)}
.profile-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.user-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--border)}
.user-row:last-child{border:0}
.user-row img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.user-row .info{flex:1;min-width:0}
.user-row .info strong{display:block}
.user-row .info span{font-size:12px;color:var(--muted)}
.user-row button{font-size:12px;padding:9px}
.comments{background:#090912;border-radius:10px;padding:10px;margin-top:10px}
.comment-row{font-size:13px;padding:7px 0;border-bottom:1px solid var(--border)}
.comment-row:last-child{border:0}
.comment-form{display:flex;gap:6px;margin-top:8px}
.comment-form input{margin:0;min-width:0}
.comment-form button{padding:8px 11px}
.chat-layout{display:grid;gap:10px}
.chat-box{border:1px solid var(--border);border-radius:10px;padding:12px;min-height:220px;max-height:420px;overflow:auto;background:#090912}
.bubble{padding:10px 12px;border-radius:13px;margin:8px 0;max-width:85%;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{background:linear-gradient(110deg,#287bff,#8246dc);color:white;margin-left:auto}
.bubble.theirs{background:#252538;color:#eee}
.bubble small{display:block;font-size:10px;opacity:.65;margin-top:5px}
.chat-send{display:flex;gap:7px;margin-top:8px}
.chat-send input{margin:0;min-width:0}
.chat-send button{white-space:nowrap}
.notice{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:13px}
.notice:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;background:#8d63ff;flex-shrink:0}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:14px}
footer{text-align:center;color:#68687c;font-size:11px;padding:15px}
@media(max-width:480px){
.logo{font-size:27px;letter-spacing:2px}
.logo-orb{width:11px;height:11px}
.logo-orbit{width:27px;height:10px}
.header-right{font-size:9px;letter-spacing:1px}
}
@media(min-width:700px){.container{padding-bottom:35px}nav{position:sticky;bottom:0;border:1px solid var(--border);border-radius:12px;margin:0 auto 15px;max-width:680px}}
</style>
</head>
<body>

<header>
<div class="logo" aria-label="WIVA">
WIV<span class="logo-a">A<span class="logo-orb"></span><span class="logo-orbit"></span></span>
</div>
<div class="header-right">YOUR WORLD. YOUR WIVA.</div>
</header>

<div class="container">

<section id="auth" class="card">
<h2>WIVA'ya Hoş Geldin</h2>
<p class="small">Sosyal dünyana katıl.</p>
<input id="fullName" placeholder="Adın ve soyadın">
<input id="userName" placeholder="Kullanıcı adın">
<input id="email" type="email" placeholder="E-posta adresin">
<input id="password" type="password" placeholder="Şifren">
<button onclick="signup()">Hesap Oluştur</button>
<button class="light" onclick="login()">Giriş Yap</button>
<div id="authMsg" class="message"></div>
</section>

<section id="app">

<div id="homePage" class="page active">
<div class="card">
<h2>Akış</h2>
<div id="feed"><div class="empty">Yükleniyor...</div></div>
<button class="outline" style="width:100%" onclick="loadFeed()">Akışı Yenile</button>
</div>
</div>

<div id="explorePage" class="page">
<div class="card">
<h2>Keşfet</h2>
<input id="userSearch" placeholder="İsim veya kullanıcı adı ara..." oninput="filterUsers()">
<div id="usersList"></div>
</div>
<div id="userDetail"></div>
</div>

<div id="sharePage" class="page">
<div class="card">
<h2>Yeni paylaşım</h2>
<textarea id="postText" maxlength="2000" placeholder="Neler düşünüyorsun?"></textarea>
<label>Fotoğraf veya video seç</label>
<input id="postFile" type="file" accept="image/*,video/*">
<button style="width:100%" onclick="publishPost()">Paylaş</button>
<div id="shareMsg" class="message"></div>
</div>
</div>

<div id="messagesPage" class="page">
<div class="card">
<h2>Mesajlar</h2>
<input id="chatSearch" placeholder="Mesaj göndermek için kullanıcı ara..." oninput="searchChatUsers()">
<div id="chatSearchResults"></div>
<h3 style="margin-top:18px">Sohbetlerin</h3>
<div id="chatList"><div class="empty">Sohbetlerin burada görünecek.</div></div>
</div>
<div id="chatWindow" class="card hidden">
<h3 id="chatTitle">Sohbet</h3>
<div id="chatMessages" class="chat-box"></div>
<div class="chat-send">
<input id="chatInput" maxlength="5000" placeholder="Mesajını yaz...">
<button onclick="sendMessage()">Gönder</button>
</div>
<div id="chatMsg" class="message"></div>
</div>
</div>

<div id="notificationsPage" class="page">
<div class="card">
<h2>Bildirimler</h2>
<div id="notificationList"></div>
<button class="outline" style="width:100%" onclick="loadNotifications()">Yenile</button>
</div>
</div>

<div id="profilePage" class="page">
<div class="card profile">
<img id="myAvatar" class="avatar" alt="Profil fotoğrafı">
<h2 id="myName">Profilim</h2>
<p id="myUsername" class="small"></p>
<p id="myBio"></p>
<div class="profile-stats">
<div><strong id="followersCount">0</strong><span>Takipçi</span></div>
<div><strong id="followingCount">0</strong><span>Takip</span></div>
<div><strong id="postsCount">0</strong><span>Paylaşım</span></div>
</div>
<button class="outline" onclick="loadMyFollowLists()">Takipçiler / Takip</button>
<div id="myFollowLists"></div>
</div>
<div class="card">
<h3>Profili düzenle</h3>
<label>Ad soyad</label>
<input id="editName" placeholder="Adın ve soyadın">
<label>Kullanıcı adı</label>
<input id="editUser" placeholder="Kullanıcı adın">
<label>Biyografi</label>
<textarea id="editBio" maxlength="250" placeholder="Kendinden bahset..."></textarea>
<label>Profil fotoğrafı</label>
<input id="avatarFile" type="file" accept="image/*">
<button style="width:100%" onclick="saveProfile()">Profili Kaydet</button>
<div id="profileMsg" class="message"></div>
</div>
<div class="card">
<h3>Paylaşımlarım</h3>
<div id="myPosts"></div>
</div>
<button class="light" style="width:100%;margin-bottom:15px" onclick="logout()">Çıkış Yap</button>
</div>

<nav>
<button id="nav-home" class="active" onclick="openTab('home')">⌂<br>Ana Sayfa</button>
<button id="nav-explore" onclick="openTab('explore')">⌕<br>Keşfet</button>
<button id="nav-share" onclick="openTab('share')">＋<br>Paylaş</button>
<button id="nav-messages" onclick="openTab('messages')">✉<br>Mesajlar</button>
<button id="nav-notifications" onclick="openTab('notifications')">♧<br>Bildirim</button>
<button id="nav-profile" onclick="openTab('profile')">♙<br>Profil</button>
</nav>
</section>
</div>
<footer>© 2026 WIVA · Your World</footer>

<script>
const SUPABASE_URL="https://coyobsmidxswejusrnca.supabase.co";
const SUPABASE_KEY="sb_publishable_ePwGpBQ3VJEeTer_FVtRQQ_AMEXlHhF";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null;
let myProfile=null;
let users=[];
let activeChat=null;
let chatTimer=null;
const placeholder="https://placehold.co/150x150/171725/aaa?text=W";

function el(id){return document.getElementById(id)}
function msg(id,t){if(el(id))el(id).textContent=t}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(s){return new Date(s).toLocaleString("tr-TR")}
function avatar(p){return esc(p?.avatar_url||placeholder)}
function notifyError(id,e){msg(id,e?.message||"Bir hata oluştu.")}

async function signup(){
const full_name=el("fullName").value.trim();
const username=el("userName").value.trim();
const email=el("email").value.trim();
const password=el("password").value;
if(!full_name||!username||!email||!password)return msg("authMsg","Bütün alanları doldur.");
if(password.length<8)return msg("authMsg","Şifre en az 8 karakter olmalı.");
if(!/^[a-zA-Z0-9_]+$/.test(username))return msg("authMsg","Kullanıcı adı yalnızca harf, rakam ve _ içerebilir.");
msg("authMsg","Hesap oluşturuluyor...");
const {data,error}=await db.auth.signUp({
email,password,
options:{emailRedirectTo:location.origin+location.pathname,data:{full_name,username}}
});
if(error)return notifyError("authMsg",error);
if(data.session){await startApp(data.session.user)}
else msg("authMsg","Kayıt oluşturuldu. E-postanı doğruladıktan sonra giriş yap.");
}

async function login(){
const email=el("email").value.trim(),password=el("password").value;
if(!email||!password)return msg("authMsg","E-posta ve şifreni gir.");
msg("authMsg","Giriş yapılıyor...");
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error)return notifyError("authMsg",error);
await startApp(data.user);
}

async function startApp(user){
me=user;
el("auth").style.display="none";
el("app").style.display="block";
await loadProfile();
await loadFeed();
}

async function loadProfile(){
if(!me)return;
const {data,error}=await db.from("profiles").select("*").eq("id",me.id).maybeSingle();
if(error){msg("profileMsg",error.message);return}
myProfile=data;
if(!data)return;
el("myName").textContent=data.full_name||"WIVA";
el("myUsername").textContent="@"+(data.username||"");
el("myBio").textContent=data.bio||"";
el("myAvatar").src=data.avatar_url||placeholder;
el("editName").value=data.full_name||"";
el("editUser").value=data.username||"";
el("editBio").value=data.bio||"";
await loadStats();
await loadMyPosts();
}

async function loadStats(){
const [f,following,p]=await Promise.all([
db.from("follows").select("*",{count:"exact",head:true}).eq("following_id",me.id),
db.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",me.id),
db.from("posts").select("*",{count:"exact",head:true}).eq("user_id",me.id)
]);
el("followersCount").textContent=f.count??0;
el("followingCount").textContent=following.count??0;
el("postsCount").textContent=p.count??0;
}

async function saveProfile(){
const full_name=el("editName").value.trim();
const username=el("editUser").value.trim();
const bio=el("editBio").value.trim();
const file=el("avatarFile").files[0];
if(!full_name||!username)return msg("profileMsg","Ad ve kullanıcı adı gerekli.");
if(!/^[a-zA-Z0-9_]+$/.test(username))return msg("profileMsg","Kullanıcı adı yalnızca harf, rakam ve _ içerebilir.");
let avatar_url=myProfile?.avatar_url||null;
if(file){
if(!file.type.startsWith("image/"))return msg("profileMsg","Bir fotoğraf seçmelisin.");
if(file.size>5*1024*1024)return msg("profileMsg","Fotoğraf 5 MB'dan küçük olmalı.");
const ext=file.name.split(".").pop().toLowerCase();
const path=me.id+"/"+Date.now()+"."+ext;
const {error}=await db.storage.from("avatars").upload(path,file);
if(error)return notifyError("profileMsg",error);
avatar_url=db.storage.from("avatars").getPublicUrl(path).data.publicUrl;
}
const update={full_name,username,bio,avatar_url};
const {error}=await db.from("profiles").update(update).eq("id",me.id);
if(error)return notifyError("profileMsg",error);
msg("profileMsg","Profil güncellendi!");
el("avatarFile").value="";
await loadProfile();
}

async function uploadPostFile(file){
if(!file)return {image_url:null,video_url:null};
if(!file.type.startsWith("image/")&&!file.type.startsWith("video/"))throw Error("Fotoğraf veya video seç.");
if(file.size>50*1024*1024)throw Error("Dosya en fazla 50 MB olabilir.");
const ext=file.name.split(".").pop().toLowerCase();
const path=me.id+"/"+Date.now()+"."+ext;
const {error}=await db.storage.from("posts").upload(path,file);
if(error)throw error;
const url=db.storage.from("posts").getPublicUrl(path).data.publicUrl;
return file.type.startsWith("image/")?{image_url:url,video_url:null}:{image_url:null,video_url:url};
}

async function publishPost(){
const content=el("postText").value.trim(),file=el("postFile").files[0];
if(!content&&!file)return msg("shareMsg","Bir yazı veya medya ekle.");
msg("shareMsg","Paylaşım yükleniyor...");
try{
const media=await uploadPostFile(file);
const {error}=await db.from("posts").insert({user_id:me.id,content,...media});
if(error)throw error;
el("postText").value="";el("postFile").value="";
msg("shareMsg","Paylaşım yayınlandı!");
await loadFeed();openTab("home");
}catch(e){notifyError("shareMsg",e)}
}

async function getProfiles(ids){
const clean=[...new Set(ids.filter(Boolean))];
if(!clean.length)return {};
const {data}=await db.from("profiles").select("id,username,full_name,bio,avatar_url").in("id",clean);
const result={};(data||[]).forEach(p=>result[p.id]=p);return result;
}

async function getLikeData(postIds){
const {data}=await db.from("likes").select("post_id,user_id").in("post_id",postIds);
return data||[];
}

async function renderPosts(posts,profiles,container){
if(!posts.length){container.innerHTML='<div class="empty">Henüz paylaşım yok.</div>';return}
const likes=await getLikeData(posts.map(p=>p.id));
const commentsResult=await db.from("comments").select("*").in("post_id",posts.map(p=>p.id)).order("created_at",{ascending:true});
const comments=commentsResult.data||[];
const commentProfiles=await getProfiles(comments.map(c=>c.user_id));
container.innerHTML=posts.map(p=>{
const user=profiles[p.user_id]||{};
const postLikes=likes.filter(l=>l.post_id===p.id);
const liked=postLikes.some(l=>l.user_id===me.id);
const postComments=comments.filter(c=>c.post_id===p.id);
let media="";
if(p.image_url)media=`<img class="post-media" src="${esc(p.image_url)}" alt="Paylaşım">`;
if(p.video_url)media=`<video class="post-media" controls playsinline src="${esc(p.video_url)}"></video>`;
return `<article class="post">
<div class="post-head">
<img class="post-avatar" src="${avatar(user)}" alt="">
<div class="who"><strong>${esc(user.full_name||"WIVA kullanıcısı")}</strong><div class="small">@${esc(user.username||"")}</div></div>
</div>
${p.content?`<div class="post-text">${esc(p.content)}</div>`:""}
${media}
<div class="post-actions">
<button class="${liked?"":"light"}" onclick="toggleLike('${p.id}','${p.user_id}')">${liked?"♥ Beğendin":"♡ Beğen"} · ${postLikes.length}</button>
<button class="light" onclick="toggleComments('${p.id}')">Yorum · ${postComments.length}</button>
</div>
<div id="comments-${p.id}" class="comments hidden">
<div>${postComments.map(c=>`<div class="comment-row"><strong>${esc(commentProfiles[c.user_id]?.username||"Kullanıcı")}</strong>: ${esc(c.content)} ${c.user_id===me.id?`<button class="light" onclick="deleteComment('${c.id}','${p.id}')">Sil</button>`:""}</div>`).join("")||'<span class="small">Henüz yorum yok.</span>'}</div>
<div class="comment-form"><input id="comment-input-${p.id}" maxlength="1000" placeholder="Yorum yaz..."><button onclick="addComment('${p.id}','${p.user_id}')">Gönder</button></div>
</div>
<div class="post-date">${date(p.created_at)}</div>
</article>`;
}).join("");
}

async function loadFeed(){
const feed=el("feed");feed.innerHTML='<div class="empty">Akış yükleniyor...</div>';
const {data,error}=await db.from("posts").select("*").order("created_at",{ascending:false}).limit(50);
if(error){feed.textContent="Akış yüklenemedi: "+error.message;return}
const profiles=await getProfiles((data||[]).map(p=>p.user_id));
await renderPosts(data||[],profiles,feed);
}

async function toggleLike(postId,ownerId){
const {data:existing,error}=await db.from("likes").select("user_id").eq("post_id",postId).eq("user_id",me.id).maybeSingle();
if(error)return alert(error.message);
if(existing){
const {error:e}=await db.from("likes").delete().eq("post_id",postId).eq("user_id",me.id);
if(e)return alert(e.message);
}else{
const {error:e}=await db.from("likes").insert({post_id:postId,user_id:me.id});
if(e)return alert(e.message);
if(ownerId!==me.id)await createNotification(ownerId,"like",postId);
}
await refreshVisiblePosts();
}

async function refreshVisiblePosts(){
const active=document.querySelector(".page.active")?.id;
if(active==="homePage")await loadFeed();
else if(active==="profilePage")await loadMyPosts();
else if(active==="explorePage"&&currentViewedUser)await openUserProfile(currentViewedUser);
}

function toggleComments(id){el("comments-"+id).classList.toggle("hidden")}

async function addComment(postId,ownerId){
const input=el("comment-input-"+postId),content=input.value.trim();
if(!content)return;
const {error}=await db.from("comments").insert({post_id:postId,user_id:me.id,content});
if(error)return alert(error.message);
if(ownerId!==me.id)await createNotification(ownerId,"comment",postId);
await refreshVisiblePosts();
setTimeout(()=>{const box=el("comments-"+postId);if(box)box.classList.remove("hidden")},100);
}

async function deleteComment(id,postId){
if(!confirm("Yorumu silmek istiyor musun?"))return;
const {error}=await db.from("comments").delete().eq("id",id).eq("user_id",me.id);
if(error)return alert(error.message);
await refreshVisiblePosts();
}

async function createNotification(recipient_id,type,post_id=null){
if(!recipient_id||recipient_id===me.id)return;
const {error}=await db.from("notifications").insert({recipient_id,actor_id:me.id,type,post_id});
if(error)console.warn("Bildirim kaydedilemedi:",error.message);
}

async function loadExplore(){
const {data,error}=await db.from("profiles").select("*").order("created_at",{ascending:false}).limit(500);
if(error){el("usersList").textContent=error.message;return}
users=data||[];filterUsers();
}

function filterUsers(){
const q=(el("userSearch").value||"").toLocaleLowerCase("tr-TR");
const filtered=users.filter(u=>(u.full_name||"").toLocaleLowerCase("tr-TR").includes(q)||(u.username||"").toLocaleLowerCase("tr-TR").includes(q));
el("usersList").innerHTML=filtered.map(u=>`
<div class="user-row">
<img src="${avatar(u)}" alt="">
<div class="info"><strong>${esc(u.full_name||"Kullanıcı")}</strong><span>@${esc(u.username||"")}</span></div>
<button onclick="openUserProfile('${u.id}')">Profili Gör</button>
</div>`).join("")||'<div class="empty">Kullanıcı bulunamadı.</div>';
}

let currentViewedUser=null;
async function openUserProfile(id){
currentViewedUser=id;
const u=users.find(x=>x.id===id)||((myProfile&&id===me.id)?{...myProfile,id:me.id}:null);
if(!u)return;
const area=el("userDetail");area.innerHTML='<div class="card empty">Profil açılıyor...</div>';
const [f,following,posts,check]=await Promise.all([
db.from("follows").select("*",{count:"exact",head:true}).eq("following_id",id),
db.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",id),
db.from("posts").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(50),
db.from("follows").select("follower_id").eq("follower_id",me.id).eq("following_id",id).maybeSingle()
]);
const isFollowing=!!check.data;
area.innerHTML=`<div class="card profile">
<img class="avatar" src="${avatar(u)}" alt="">
<h2>${esc(u.full_name||"Kullanıcı")}</h2>
<p class="small">@${esc(u.username||"")}</p>
<p>${esc(u.bio||"")}</p>
<div class="profile-stats">
<div><strong>${f.count??0}</strong><span>Takipçi</span></div>
<div><strong>${following.count??0}</strong><span>Takip</span></div>
<div><strong>${posts.data?.length||0}</strong><span>Paylaşım</span></div>
</div>
<div class="profile-actions">
${id!==me.id?`<button id="followBtn" onclick="toggleFollow('${id}')">${isFollowing?"Takibi Bırak":"Takip Et"}</button><button class="outline" onclick="startChat('${id}')">Mesaj Gönder</button>`:""}
<button class="light" onclick="el('userDetail').innerHTML=''">Kapat</button>
</div></div><div id="otherPosts"></div>`;
if(posts.error){el("otherPosts").textContent=posts.error.message;return}
await renderPosts(posts.data||[], {[id]:u}, el("otherPosts"));
}

async function toggleFollow(id){
const {data:existing,error}=await db.from("follows").select("follower_id").eq("follower_id",me.id).eq("following_id",id).maybeSingle();
if(error)return alert(error.message);
if(existing){
const {error:e}=await db.from("follows").delete().eq("follower_id",me.id).eq("following_id",id);
if(e)return alert(e.message);
}else{
const {error:e}=await db.from("follows").insert({follower_id:me.id,following_id:id});
if(e)return alert(e.message);
await createNotification(id,"follow");
}
await openUserProfile(id);
await loadStats();
}

async function loadMyFollowLists(){
const area=el("myFollowLists");area.innerHTML='<div class="small">Listeler yükleniyor...</div>';
const [followers,following]=await Promise.all([
db.from("follows").select("follower_id").eq("following_id",me.id),
db.from("follows").select("following_id").eq("follower_id",me.id)
]);
const ids=[...(followers.data||[]).map(x=>x.follower_id),...(following.data||[]).map(x=>x.following_id)];
const profiles=await getProfiles(ids);
area.innerHTML="<h3>Takipçiler</h3>"+(followers.data||[]).map(x=>miniUser(profiles[x.follower_id])).join("")+
"<h3 style='margin-top:15px'>Takip ettiklerin</h3>"+(following.data||[]).map(x=>miniUser(profiles[x.following_id])).join("");
if(!ids.length)area.innerHTML='<div class="empty">Henüz takipçi veya takip edilen yok.</div>';
}

function miniUser(u){
if(!u)return "";
return `<div class="user-row"><img src="${avatar(u)}"><div class="info"><strong>${esc(u.full_name)}</strong><span>@${esc(u.username)}</span></div></div>`;
}

async function loadMyPosts(){
const area=el("myPosts");
const {data,error}=await db.from("posts").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(50);
if(error){area.textContent=error.message;return}
await renderPosts(data||[],{[me.id]:myProfile||{}},area);
}

async function loadNotifications(){
const area=el("notificationList");area.innerHTML='<div class="empty">Bildirimler yükleniyor...</div>';
const {data,error}=await db.from("notifications").select("*").eq("recipient_id",me.id).order("created_at",{ascending:false}).limit(100);
if(error){area.textContent=error.message;return}
if(!data?.length){area.innerHTML='<div class="empty">Henüz bildirimin yok.</div>';return}
const profiles=await getProfiles(data.map(n=>n.actor_id));
area.innerHTML=data.map(n=>{
const actor=profiles[n.actor_id]||{};
const label={follow:"seni takip etmeye başladı.",like:"paylaşımını beğendi.",comment:"paylaşımına yorum yaptı."}[n.type]||"etkileşimde bulundu.";
return `<div class="notice"><span class="dot" style="opacity:${n.is_read?0.2:1}"></span><img class="post-avatar" src="${avatar(actor)}"><div><strong>${esc(actor.username||"Kullanıcı")}</strong> ${label}<div class="small">${date(n.created_at)}</div></div></div>`;
}).join("");
await db.from("notifications").update({is_read:true}).eq("recipient_id",me.id).eq("is_read",false);
}

async function searchChatUsers(){
const q=el("chatSearch").value.trim().toLocaleLowerCase("tr-TR");
if(q.length<2){el("chatSearchResults").innerHTML="";return}
const {data,error}=await db.from("profiles").select("id,username,full_name,avatar_url").limit(500);
if(error){el("chatSearchResults").textContent=error.message;return}
const results=(data||[]).filter(u=>u.id!==me.id&&((u.username||"").toLocaleLowerCase("tr-TR").includes(q)||(u.full_name||"").toLocaleLowerCase("tr-TR").includes(q)));
el("chatSearchResults").innerHTML=results.map(u=>`
<div class="user-row"><img src="${avatar(u)}"><div class="info"><strong>${esc(u.full_name)}</strong><span>@${esc(u.username)}</span></div><button onclick="startChat('${u.id}')">Mesaj</button></div>`).join("")||'<div class="small">Kullanıcı bulunamadı.</div>';
}

async function loadChatList(){
const {data,error}=await db.from("messages").select("*").or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order("created_at",{ascending:false}).limit(200);
if(error){el("chatList").textContent=error.message;return}
const latest={};
(data||[]).forEach(m=>{
const other=m.sender_id===me.id?m.receiver_id:m.sender_id;
if(!latest[other])latest[other]=m;
});
const ids=Object.keys(latest);
if(!ids.length){el("chatList").innerHTML='<div class="empty">Henüz sohbetin yok.</div>';return}
const profiles=await getProfiles(ids);
el("chatList").innerHTML=ids.map(id=>{
const u=profiles[id]||{},m=latest[id];
return `<div class="user-row"><img src="${avatar(u)}"><div class="info"><strong>${esc(u.full_name||"Kullanıcı")}</strong><span>${esc(m.content.slice(0,50))}</span></div><button onclick="startChat('${id}')">Aç</button></div>`;
}).join("");
}

async function startChat(userId){
activeChat=userId;
const profile=users.find(u=>u.id===userId);
let p=profile;
if(!p){const {data}=await db.from("profiles").select("*").eq("id",userId).maybeSingle();p=data}
el("chatWindow").classList.remove("hidden");
el("chatTitle").textContent=p?.full_name||"Sohbet";
await loadChatMessages();
if(chatTimer)clearInterval(chatTimer);
chatTimer=setInterval(()=>{if(activeChat)loadChatMessages()},10000);
el("chatInput").focus();
}

async function loadChatMessages(){
if(!activeChat)return;
const {data,error}=await db.from("messages").select("*")
.or(`and(sender_id.eq.${me.id},receiver_id.eq.${activeChat}),and(sender_id.eq.${activeChat},receiver_id.eq.${me.id})`)
.order("created_at",{ascending:true}).limit(200);
if(error){el("chatMessages").textContent=error.message;return}
el("chatMessages").innerHTML=(data||[]).map(m=>`
<div class="bubble ${m.sender_id===me.id?"mine":"theirs"}">${esc(m.content)}<small>${date(m.created_at)}</small></div>`).join("")||'<div class="empty">Sohbeti başlat.</div>';
el("chatMessages").scrollTop=el("chatMessages").scrollHeight;
const unread=(data||[]).filter(m=>m.receiver_id===me.id&&!m.read_at).map(m=>m.id);
if(unread.length)await db.from("messages").update({read_at:new Date().toISOString()}).in("id",unread);
}

async function sendMessage(){
const content=el("chatInput").value.trim();
if(!content||!activeChat)return;
const {error}=await db.from("messages").insert({sender_id:me.id,receiver_id:activeChat,content});
if(error){msg("chatMsg",error.message);return}
el("chatInput").value="";
msg("chatMsg","");
await loadChatMessages();
await loadChatList();
}

el("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

function openTab(tab){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
el(tab+"Page").classList.add("active");
el("nav-"+tab).classList.add("active");
if(tab==="home")loadFeed();
if(tab==="explore")loadExplore();
if(tab==="profile")loadProfile();
if(tab==="notifications")loadNotifications();
if(tab==="messages")loadChatList();
}

async function logout(){
if(chatTimer)clearInterval(chatTimer);
const {error}=await db.auth.signOut();
if(error)return alert(error.message);
me=null;activeChat=null;
el("app").style.display="none";
el("auth").style.display="block";
}

db.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_IN"&&session?.user){
me=session.user;
el("auth").style.display="none";
el("app").style.display="block";
}
if(event==="SIGNED_OUT"){
me=null;
el("app").style.display="none";
el("auth").style.display="block";
}
});

db.auth.getSession().then(({data})=>{
if(data.session)startApp(data.session.user);
});
</script>
</body>
</html>
